server:
  port: ${API_PORT:3000}
  address: 0.0.0.0

spring:
  application:
    name: signal-api
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

signal:
  auth-mode: ${AUTH_MODE:mock}
  data-store: ${DATA_STORE:mock}
  dev-auth-token: ${DEV_AUTH_TOKEN:demo-token}
  dev-auth-user-id: ${DEV_AUTH_USER_ID:demo-user}
  dev-auth-token-map: ${DEV_AUTH_TOKEN_MAP:}
  supabase-url: ${SUPABASE_URL:}
  cors-origins: ${API_CORS_ORIGINS:}
  worker-service-token: ${WORKER_SERVICE_TOKEN:}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
  gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
