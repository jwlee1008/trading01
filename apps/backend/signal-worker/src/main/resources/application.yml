spring:
  application:
    name: signal-worker
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}

signal:
  worker:
    once: ${WORKER_ONCE:false}
    enabled: ${WORKER_ENABLED:false}
    push-provider: ${PUSH_PROVIDER:disabled}
    outbox-batch-size: ${PUSH_OUTBOX_BATCH_SIZE:50}
    outbox-lease-seconds: ${PUSH_OUTBOX_LEASE_SECONDS:300}
    outbox-cron: ${WORKER_OUTBOX_CRON:0 */1 * * * *}
    daily-cycle-enabled: ${WORKER_DAILY_CYCLE_ENABLED:false}
    expected-through: ${MARKET_DATA_EXPECTED_THROUGH:}
    candle-lookback: ${WORKER_CANDLE_LOOKBACK:500}
    paper-orders-enabled: ${WORKER_PAPER_ORDERS_ENABLED:false}
    sell-cycle-enabled: ${WORKER_SELL_CYCLE_ENABLED:false}
    ranked-buy-enabled: ${WORKER_RANKED_BUY_ENABLED:false}
    market-data-auto-enabled: ${WORKER_MARKET_DATA_AUTO_ENABLED:false}
    market-data-auto-initial-delay-ms: ${WORKER_MARKET_DATA_AUTO_INITIAL_DELAY_MS:5000}
    market-data-auto-interval-ms: ${WORKER_MARKET_DATA_AUTO_INTERVAL_MS:300000}
    ranked-buy-batch-size: ${RANKED_BUY_BATCH_SIZE:500}
    paper-order-batch-size: ${PAPER_ORDER_BATCH_SIZE:100}
    market-data-action: ${MARKET_DATA_ACTION:none}
    market-data-from: ${BACKFILL_FROM:}
    market-data-through: ${BACKFILL_THROUGH:}
    market-data-symbols: ${BACKFILL_SYMBOLS:}
    market-data-dataset-version: ${MARKET_DATA_DATASET_VERSION:kiwoom-d1-v1}
    market-calendar-version: ${MARKET_CALENDAR_VERSION:}
    market-calendar-holidays: ${MARKET_CALENDAR_HOLIDAYS:}
    market-calendar-extra-sessions: ${MARKET_CALENDAR_EXTRA_SESSIONS:}
    kiwoom-base-url: ${KIWOOM_API_BASE_URL:}
    kiwoom-mode: ${KIWOOM_MODE:${BROKER_MODE:real}}
    kiwoom-app-key: ${KIWOOM_APP_KEY:${BROKER_APP_KEY:}}
    kiwoom-app-secret: ${KIWOOM_APP_SECRET:${BROKER_APP_SECRET:}}
    kiwoom-mock-app-key: ${KIWOOM_APP_KEY_MOCK:}
    kiwoom-mock-app-secret: ${KIWOOM_APP_SECRET_MOCK:}
    kiwoom-max-pages: ${KIWOOM_MAX_PAGES:30}
    backfill-chunk-days: ${BACKFILL_CHUNK_DAYS:180}
    backfill-max-retries: ${BACKFILL_MAX_RETRIES:3}
    backfill-request-delay-ms: ${BACKFILL_REQUEST_DELAY_MS:250}
    backfill-max-instruments: ${BACKFILL_MAX_INSTRUMENTS:0}
    backfill-dry-run: ${BACKFILL_DRY_RUN:false}
    universe-effective-from: ${MARKET_DATA_UNIVERSE_EFFECTIVE_FROM:2026-08-01}
    universe-source-revision: ${MARKET_DATA_UNIVERSE_SOURCE_REVISION:}
    top100-as-of: ${TOP100_AS_OF:}
    backfill-universe-kind: ${BACKFILL_UNIVERSE_KIND:}
    demo-top50-enabled: ${DEMO_TOP50_ENABLED:false}
    demo-top50-real-count: ${DEMO_TOP50_REAL_COUNT:10}
    demo-top50-synthetic-count: ${DEMO_TOP50_SYNTHETIC_COUNT:40}
    demo-top50-seed: ${DEMO_TOP50_SEED:20260822}
